# CI gate for deep-code-pet
#
# Triggers: push to main, any pull request, manual dispatch.
# Two jobs must both pass:
#   frontend - JS syntax, offline self-tests, Vite build
#   rust     - rustfmt, clippy (-D warnings), cargo test, `tauri build --no-bundle`
#
# The rust job runs on macOS because the Tauri macOS backend links system
# frameworks. `--no-bundle` compiles without packaging, which catches broken
# config and compile errors in minutes; full dmg builds live in release.yml.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push supersedes the previous run instead of queueing behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: frontend (checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from `packageManager` in package.json; passing
      # `with: version` as well makes the action refuse to start.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Syntax check
        run: for f in *.js *.mjs; do node --check "$f"; done

      - name: Offline self-tests
        run: node selftest.mjs

      - name: Build frontend
        run: pnpm build

  rust:
    name: rust (checks)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: rustfmt
        run: cargo fmt --all -- --check
        working-directory: src-tauri

      - name: clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      - name: cargo test
        run: cargo test
        working-directory: src-tauri

      # Version comes from `packageManager` in package.json; passing
      # `with: version` as well makes the action refuse to start.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Tauri build (no bundle)
        run: pnpm exec tauri build --no-bundle
