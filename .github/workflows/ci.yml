# CI gate for deep-code-pet
#
# Triggers: push to main, any pull request, manual dispatch.
# Two jobs must both pass:
#   frontend - TypeScript, unit tests, SPA build, browser tests (Linux)
#   rust     - rustfmt, clippy (-D warnings), cargo test, `tauri build --no-bundle`
#              on macOS, Linux and Windows: the three platforms we ship
#
# The rust matrix is what keeps the app honestly cross-platform. `--no-bundle`
# compiles without packaging, which catches broken config and compile errors in
# minutes; full installer builds live in release.yml.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push supersedes the previous run instead of queueing behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: frontend (checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from `packageManager` in package.json; passing
      # `with: version` as well makes the action refuse to start.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build frontend
        run: pnpm build

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser tests against desktop assets
        run: pnpm test:e2e

  rust:
    name: rust (checks, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # The Tauri Linux backend links WebKitGTK / GTK / appindicator. macOS and
      # Windows ship their equivalents on the image, so this step is Linux-only.
      # Bundler-only dependencies (libfuse2 for AppImage, patchelf) belong in
      # release.yml: this job stops at `--no-bundle`.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            libxdo-dev \
            build-essential \
            file

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: rustfmt
        run: cargo fmt --all -- --check
        working-directory: src-tauri

      # Toolchain is intentionally not pinned: clippy runs on the current
      # stable so newly introduced lints surface here first. A local toolchain
      # older than CI will not reproduce every lint, so a green local run is
      # necessary but not sufficient - treat the CI report as the source of
      # truth and fix the lint rather than relaxing the gate.
      - name: clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      - name: cargo test
        run: cargo test
        working-directory: src-tauri

      # Version comes from `packageManager` in package.json; passing
      # `with: version` as well makes the action refuse to start.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Tauri build (no bundle)
        run: pnpm exec tauri build --no-bundle
