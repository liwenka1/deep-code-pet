# Release workflow for deep-code-pet
#
# Usage: Actions -> Release -> Run workflow, enter a version without the "v"
# prefix (for example 0.0.1).
#
# What it does:
#   1. validates semver, requires the run to come from main, and refuses an
#      existing tag;
#   2. writes the version into four files (package.json, src-tauri/tauri.conf.json,
#      src-tauri/Cargo.toml, src-tauri/Cargo.lock) - they must agree or the
#      artifact advertises the wrong version;
#   3. commits, tags, pushes;
#   4. builds both macOS architectures and uploads one dmg each to the same
#      GitHub Release.
#
# Two things to know:
#   - The dmg is UNSIGNED unless Apple signing secrets are wired in. Gatekeeper
#     will block it; users run `xattr -cr /Applications/deep-code-pet.app`.
#   - Commits pushed with GITHUB_TOKEN do not re-trigger CI (GitHub prevents
#     recursive runs), so main must be green before releasing.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the v prefix (for example 0.0.1)'
        required: true
        type: string
      prerelease:
        description: 'Mark the release as a prerelease'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: prepare (version bump and tag)
    # Only edits files and pushes a commit, so no Rust toolchain needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require the main branch
        if: ${{ github.ref_name != 'main' }}
        run: |
          echo "::error::run this from main (current ref: '${GITHUB_REF_NAME}')"
          exit 1

      - name: Validate version and tag
        run: |
          V="${{ inputs.version }}"
          echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' \
            || { echo "::error::version must look like x.y.z: $V"; exit 1; }
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
            echo "::error::tag v$V already exists"; exit 1
          fi

      - name: Write the version into four files
        run: |
          V="${{ inputs.version }}"
          node -e '
            const fs = require("fs");
            const v = process.argv[1];
            for (const file of ["package.json", "src-tauri/tauri.conf.json"]) {
              const json = JSON.parse(fs.readFileSync(file, "utf8"));
              json.version = v;
              fs.writeFileSync(file, JSON.stringify(json, null, 2) + "\n");
            }
          ' "$V"
          sed -i.bak -E 's/^version = ".*"/version = "'"$V"'"/' src-tauri/Cargo.toml
          rm -f src-tauri/Cargo.toml.bak
          # Only the entry for this package: the line follows its `name` line.
          sed -i.bak -E '/^name = "deep-code-pet"$/,/^version = / s/^version = ".*"/version = "'"$V"'"/' src-tauri/Cargo.lock
          rm -f src-tauri/Cargo.lock.bak
          git --no-pager diff --stat

      - name: Commit, tag, push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): v${{ inputs.version }}"
          git tag "v${{ inputs.version }}"
          git push origin "HEAD:${{ github.ref_name }}"
          git push origin "v${{ inputs.version }}"

  build:
    name: build (${{ matrix.name }})
    needs: prepare
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: darwin-arm64
            target: aarch64-apple-darwin
          - name: darwin-x64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app and dmg
        run: pnpm exec tauri build --target ${{ matrix.target }}

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
