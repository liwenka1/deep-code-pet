# Release workflow for deep-code-pet
#
# Usage: Actions -> Release -> Run workflow, enter a version without the "v"
# prefix (for example 0.0.1).
#
# What it does:
#   1. validates semver, requires the run to come from main, and refuses an
#      existing tag;
#   2. writes the version into four files (package.json, src-tauri/tauri.conf.json,
#      src-tauri/Cargo.toml, src-tauri/Cargo.lock) - they must agree or the
#      artifact advertises the wrong version;
#   3. commits, tags, pushes;
#   4. builds macOS (both architectures), Windows and Linux, and uploads every
#      installer to the same GitHub Release.
#
# Two things to know:
#   - Nothing is signed. macOS blocks the dmg until `xattr -cr`, Windows shows a
#     SmartScreen warning, Linux installers are unsigned by nature.
#   - Commits pushed with GITHUB_TOKEN do not re-trigger CI (GitHub prevents
#     recursive runs), so main must be green before releasing.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the v prefix (for example 0.0.1)'
        required: true
        type: string
      prerelease:
        description: 'Mark the release as a prerelease'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: prepare (version bump and tag)
    # Only edits files and pushes a commit, so no Rust toolchain needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require the main branch
        if: ${{ github.ref_name != 'main' }}
        run: |
          echo "::error::run this from main (current ref: '${GITHUB_REF_NAME}')"
          exit 1

      - name: Validate version and tag
        run: |
          V="${{ inputs.version }}"
          echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' \
            || { echo "::error::version must look like x.y.z: $V"; exit 1; }
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
            echo "::error::tag v$V already exists"; exit 1
          fi

      - name: Write the version into four files
        run: |
          V="${{ inputs.version }}"
          node -e '
            const fs = require("fs");
            const v = process.argv[1];
            for (const file of ["package.json", "src-tauri/tauri.conf.json"]) {
              const json = JSON.parse(fs.readFileSync(file, "utf8"));
              json.version = v;
              fs.writeFileSync(file, JSON.stringify(json, null, 2) + "\n");
            }
          ' "$V"
          sed -i.bak -E 's/^version = ".*"/version = "'"$V"'"/' src-tauri/Cargo.toml
          rm -f src-tauri/Cargo.toml.bak
          # Only the entry for this package: the line follows its `name` line.
          sed -i.bak -E '/^name = "deep-code-pet"$/,/^version = / s/^version = ".*"/version = "'"$V"'"/' src-tauri/Cargo.lock
          rm -f src-tauri/Cargo.lock.bak
          git --no-pager diff --stat

      - name: Commit, tag, push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The requested version may already be the one in the tree (re-cutting a
          # release, or releasing straight after the initial commit). In that case
          # there is nothing to commit and a plain `git commit` exits 1, so only
          # commit when the bump actually changed something.
          if [ -n "$(git status --porcelain)" ]; then
            git commit -am "chore(release): v${{ inputs.version }}"
            git push origin "HEAD:${{ github.ref_name }}"
          else
            echo "version ${{ inputs.version }} already in the tree; tagging the current commit"
          fi
          git tag "v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"

  build:
    name: build (${{ matrix.name }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: darwin-arm64
            runner: macos-14
            target: aarch64-apple-darwin
            bundles: app,dmg
            artifacts: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - name: darwin-x64
            runner: macos-14
            target: x86_64-apple-darwin
            bundles: app,dmg
            artifacts: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          - name: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            artifacts: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          - name: linux-x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            artifacts: |
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}

      # The Tauri Linux backend links WebKitGTK / GTK / appindicator; the
      # AppImage bundler also wants FUSE (libfuse2) and patchelf.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            libxdo-dev \
            libfuse2 \
            patchelf \
            build-essential \
            file

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      # Version comes from `packageManager` in package.json; passing
      # `with: version` as well makes the action refuse to start.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `bundle.targets` in tauri.conf.json is "all", so a plain local
      # `pnpm tauri build` also tries the targets this machine cannot produce
      # (rpm on Linux, msi on Windows). The matrix pins exactly one set per
      # platform, which is why every build passes --bundles explicitly.
      - name: Build app and installers
        run: pnpm exec tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      # Artifacts go to the publish job instead of straight to the release:
      # four jobs creating/updating the same release in parallel is a race.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  publish:
    name: publish (upload to the release)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          prerelease: ${{ inputs.prerelease }}
          # Notes are generated once, here, rather than by every build job.
          generate_release_notes: true
          files: artifacts/**/*
